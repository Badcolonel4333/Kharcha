<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kharcha">
<title>Kharcha – Expense Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#0f766e;--bd:#e5e7eb;--bar:#99f6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--card:#151b23;--tx:#f3f4f6;--mu:#9ca3af;--ac:#2dd4bf;--bd:#263040;--bar:#115e59}}
:root[data-theme="dark"]{--bg:#0b0f14;--card:#151b23;--tx:#f3f4f6;--mu:#9ca3af;--ac:#2dd4bf;--bd:#263040;--bar:#115e59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{padding:12px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#042f2e}}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--bd);font-size:14px;cursor:pointer;background:var(--bg)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#042f2e}}
.it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.x{background:none;color:var(--mu);padding:4px 8px;font-size:18px}
.br{height:8px;border-radius:4px;background:var(--bar);margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.sum{border-left:4px solid var(--ac)}
.dn{max-width:240px;margin:12px auto}.dn svg{width:100%}
.lg{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}.lg:last-of-type{border:0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.lg small{color:var(--mu)}
.bars{display:flex;gap:3px;align-items:flex-end}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bc small{font-size:10px;color:var(--mu);height:13px;line-height:13px;white-space:nowrap}.bb{width:100%;border-radius:3px 3px 0 0;background:var(--ac)}.bars.m .bc{cursor:pointer}
</style></head><body>
<h1>💸 Kharcha <small class="mu">v2</small></h1>
<div class="card"><div class="mu">Today</div><div class="big" id="today">₹0</div><div class="mu" id="month"></div></div>
<div class="card">
  <div class="row"><input id="amt" type="number" inputmode="decimal" placeholder="Amount ₹"><input id="dt" type="date" style="max-width:150px"></div>
  <div class="chips" id="chips"></div>
  <div class="row"><input id="cat" placeholder="Or type a new category"><button id="add">Add</button></div>
</div>
<div class="tabs"><button class="g" data-t="list">Entries</button><button class="g" data-t="cats">Charts</button><button class="g" data-t="set">Settings</button></div>
<div class="card" id="view"></div>
<script>
const DEF=["Eating","Eating Essential","Travel","Essential","Home","Khushi","Outing","Recharge","Haircut","Rent","Misc"];
let S={e:[],cats:DEF,rt:"21:30",lastSum:""},tab="list",pick="";
try{const s=localStorage.getItem("kharcha");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem("kharcha",JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const sum=a=>a.reduce((t,x)=>t+x.a,0);
$("dt").value=ymd(new Date());
function chips(){$("chips").innerHTML=S.cats.map(c=>`<span class="chip ${c===pick?"on":""}" data-c="${c}">${c}</span>`).join("")}
$("chips").onclick=e=>{const c=e.target.dataset.c;if(c){pick=c===pick?"":c;$("cat").value="";chips()}};
$("add").onclick=()=>{const a=parseFloat($("amt").value),c=($("cat").value.trim()||pick);
  if(!a||a<=0||!c){alert("Enter an amount and pick a category");return}
  if(!S.cats.includes(c))S.cats.push(c);
  S.e.push({id:Date.now(),d:$("dt").value||ymd(new Date()),c,a});save();$("amt").value="";$("cat").value="";pick="";render()};
const PAL=["#0f766e","#f59e0b","#6366f1","#ef4444","#10b981","#ec4899","#64748b"];let cm=null;
function monthsChart(ks){if(!ks.length)return"";const k2=ks.slice(-12),v=k2.map(k=>sum(S.e.filter(x=>x.d.startsWith(k)))),mx=Math.max(...v)||1;
  return '<div class="mu" style="margin:18px 0 6px">Month by month (tap a bar)</div><div class="bars m">'+k2.map((k,i)=>`<div class="bc" data-gm="${k}"><small>${Math.round(v[i]/100)/10}k</small><div class="bb" style="height:${Math.max(2,v[i]/mx*90)}px;opacity:${k===cm?1:.4}"></div><small>${new Date(+k.slice(0,4),+k.slice(5,7)-1,1).toLocaleString("en-IN",{month:"short"})}</small></div>`).join("")+'</div>'}
function charts(){const ks=[...new Set(S.e.map(x=>x.d.slice(0,7)))].sort();
  if(!cm){const t=ymd(new Date()).slice(0,7);cm=S.e.some(x=>x.d.startsWith(t))?t:(ks[ks.length-1]||t)}
  const[Y,M]=cm.split("-").map(Number),lab=new Date(Y,M-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"}),me=S.e.filter(x=>x.d.startsWith(cm)),tot=sum(me);
  let h=`<div class="row" style="justify-content:space-between"><button class="g" data-mv="-1">‹</button><b>${lab}</b><button class="g" data-mv="1">›</button></div>`;
  if(!me.length)return h+'<div class="mu" style="margin:16px 0">No expenses this month.</div>'+monthsChart(ks);
  const by={};me.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);let en=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(en.length>7){const r=en.slice(6).reduce((t,o)=>t+o[1],0);en=en.slice(0,6).concat([["Others",r]])}
  let off=25;const arcs=en.map(([k,v],i)=>{const p=v/tot*100,c=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return c}).join("");
  h+=`<div class="dn"><svg viewBox="0 0 42 42">${arcs}<text x="21" y="20.5" text-anchor="middle" font-size="3.4" font-weight="700" fill="currentColor">${inr(tot)}</text><text x="21" y="25" text-anchor="middle" font-size="2.2" fill="currentColor" opacity=".6">spent</text></svg></div>`;
  h+=en.map(([k,v],i)=>`<div class="lg"><span><i style="background:${PAL[i]}"></i>${k}</span><span><b>${inr(v)}</b> <small>${Math.round(v/tot*100)}%</small></span></div>`).join("");
  const dim=new Date(Y,M,0).getDate(),dd=Array(dim).fill(0);me.forEach(x=>{const i=+x.d.slice(8,10)-1;if(i>=0&&i<dim)dd[i]+=x.a});const mx=Math.max(...dd)||1;
  h+='<div class="mu" style="margin:16px 0 6px">Daily spend</div><div class="bars">'+dd.map((v,i)=>`<div class="bc"><div class="bb" title="${i+1}: ${inr(v)}" style="height:${v?Math.max(2,v/mx*90):0}px"></div><small>${(i+1)%5===1?i+1:""}</small></div>`).join("")+'</div>';
  return h+monthsChart(ks)}
function render(){const t=ymd(new Date()),mo=t.slice(0,7);
  $("today").textContent=inr(sum(S.e.filter(x=>x.d===t)));
  $("month").textContent=new Date().toLocaleString("en-IN",{month:"long"})+" total: "+inr(sum(S.e.filter(x=>x.d.startsWith(mo))));
  chips();
  document.querySelectorAll(".tabs button").forEach(b=>b.style.opacity=b.dataset.t===tab?1:.55);
  const v=$("view");
  if(tab==="list"){const l=[...S.e].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,60);
    v.innerHTML=l.length?l.map(x=>`<div class="it"><div>${x.c}<div class="mu">${x.d}</div></div><div><b>${inr(x.a)}</b><button class="x" data-del="${x.id}">×</button></div></div>`).join(""):'<div class="mu">No entries yet.</div>'}
  else if(tab==="cats"){v.innerHTML=charts()}
  else{v.innerHTML=`<div class="mu">Nightly notification time</div><input type="time" id="rt" value="${S.rt}" style="margin:6px 0 12px">
    <button id="notif" class="g" style="width:100%;margin-bottom:8px">Enable notifications (works while app is open)</button>
    <div class="mu">Categories (tap × to delete)</div><div class="chips">${S.cats.map(c=>`<span class="chip">${c} <b data-rc="${c}" style="cursor:pointer;padding:0 2px">×</b></span>`).join("")}</div>
    <button id="xl" style="width:100%">⬇ Export to Excel</button>
    <div class="mu" id="msg" style="margin-top:8px"></div>`;
    $("rt").onchange=e=>{S.rt=e.target.value;save();render()};
    $("notif").onclick=async()=>{try{const r=await Notification.requestPermission();$("msg").textContent="Notifications: "+r}catch(e){$("msg").textContent="Not supported in this browser."}};
    $("xl").onclick=exportXl}}
document.querySelector(".tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("view").onclick=e=>{const t=e.target,d=t.dataset.del,rc=t.dataset.rc,mv=t.dataset.mv,gm=(t.closest("[data-gm]")||{dataset:{}}).dataset.gm;
  if(d){S.e=S.e.filter(x=>x.id!=d);save();render()}
  else if(rc){const n=S.e.filter(x=>x.c===rc).length;if(!confirm('Delete category "'+rc+'"?'))return;
    if(n&&confirm(n+' entries use "'+rc+'". Press OK to delete those entries too, or Cancel to keep them.'))S.e=S.e.filter(x=>x.c!==rc);
    S.cats=S.cats.filter(c=>c!==rc);if(pick===rc)pick="";save();render()}
  else if(mv){const[y,m]=cm.split("-").map(Number),dt=new Date(y,m-1+ +mv,1);cm=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");render()}
  else if(gm){cm=gm;render()}};
async function exportXl(){const msg=$("msg");
  const rows=[...S.e].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({Date:x.d,Usecase:x.c,Amount:x.a}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Expenses");
  const mm={};S.e.forEach(x=>{const m=x.d.slice(0,7);(mm[m]=mm[m]||{})[x.c]=(mm[m][x.c]||0)+x.a});
  const sm=[];Object.keys(mm).sort().forEach(m=>Object.entries(mm[m]).forEach(([c,a])=>sm.push({Month:m,Usecase:c,Total:a})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sm),"Monthly Summary");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{const dl=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:"Expenses-"+ymd(new Date())+".xlsx",data:buf});msg.textContent="Saved ✔"}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf]));a.download="Expenses.xlsx";a.click()}
  }catch(e){msg.textContent=e&&e.code==="declined"?"Cancelled.":"Download failed: "+(e&&e.message||e)}}
function tick(){const n=new Date(),k=ymd(n),[h,m]=S.rt.split(":").map(Number);
  if(S.lastSum!==k&&n.getHours()*60+n.getMinutes()>=h*60+m){S.lastSum=k;save();
    try{if(Notification.permission==="granted"){const t=S.e.filter(x=>x.d===k);new Notification("Today you spent "+inr(sum(t)),{body:t.length+" entries logged"})}}catch(e){}
    render()}}
/* manifest entry points: shortcuts (?t= / ?a=), share target + protocol handler (?text= / ?q=), file handler */
(function(){const q=new URLSearchParams(location.search),t=q.get("t");if(t==="list"||t==="cats"||t==="set")tab=t;
  const m=(q.get("text")||q.get("q")||q.get("title")||"").match(/(\d[\d,]*(?:\.\d+)?)/);
  if(m)$("amt").value=m[1].replace(/,/g,"");
  if(q.get("a")==="add"||m)setTimeout(()=>$("amt").focus(),300);
  if(location.search)history.replaceState(null,"",location.pathname)})();
if("launchQueue" in window)launchQueue.setConsumer(async p=>{if(!p.files||!p.files.length)return;
  try{const f=await p.files[0].getFile(),wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]),add=[];
    r.forEach((o,i)=>{let d=o.Date,c=o.Usecase,a=parseFloat(o.Amount);d=d instanceof Date?ymd(d):String(d||"").slice(0,10);
      if(c&&a>0&&/^\d{4}-\d{2}-\d{2}$/.test(d))add.push({id:Date.now()+i,d,c:String(c).trim(),a})});
    if(!add.length){alert("No rows found. Columns needed: Date, Usecase, Amount");return}
    if(!confirm("Import "+add.length+" entries from "+f.name+"?"))return;
    add.forEach(x=>{if(!S.cats.includes(x.c))S.cats.push(x.c);S.e.push(x)});save();render()}catch(e){alert("Could not read that file")}});
setInterval(tick,30000);tick();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
