$("view").onclick=e=>{const d=e.target.dataset.del;if(d){S.e=S.e.filter(x=>x.id!=d);save();render()}};
async function exportXl(){const msg=$("msg");
  const rows=[...S.e].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({Date:x.d,Usecase:x.c,Amount:x.a}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Expenses");
  const mm={};S.e.forEach(x=>{const m=x.d.slice(0,7);(mm[m]=mm[m]||{})[x.c]=(mm[m][x.c]||0)+x.a});
  const sm=[];Object.keys(mm).sort().forEach(m=>Object.entries(mm[m]).forEach(([c,a])=>sm.push({Month:m,Usecase:c,Total:a})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sm),"Monthly Summary");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{const dl=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:"Expenses-"+ymd(new Date())+".xlsx",data:buf});msg.textContent="Saved ✔"}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf]));a.download="Expenses.xlsx";a.click()}
  }catch(e){msg.textContent=e&&e.code==="declined"?"Cancelled.":"Download failed: "+(e&&e.message||e)}}
function tick(){const n=new Date(),k=ymd(n),[h,m]=S.rt.split(":").map(Number);
  if(S.lastSum!==k&&n.getHours()*60+n.getMinutes()>=h*60+m){S.lastSum=k;save();
    try{if(Notification.permission==="granted"){const t=S.e.filter(x=>x.d===k);new Notification("Today you spent "+inr(sum(t)),{body:t.length+" entries logged"})}}catch(e){}
    render()}}
setInterval(tick,30000);tick();render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
